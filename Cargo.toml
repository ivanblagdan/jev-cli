[package]
name = "jev-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Composable CLI for TypeSafe's Choice, Score, and Noul primitives"

[[bin]]
name = "jev"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
httpdate = "1"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "io-std", "fs"] }

[dev-dependencies]
tempfile = "3"
